<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HafalanQu</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#003527",
                        surface: "#f8f9fa",
                        "on-surface": "#191c1d",
                        "primary-container": "#064e3b",
                        "on-primary": "#ffffff",
                        "outline": "#707974",
                    },
                    fontFamily: {
                        headline: ["EB Garamond"],
                        body: ["Inter"],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2 { font-family: 'EB Garamond', serif; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white max-w-md w-full rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <div class="bg-primary px-8 py-10 text-center text-on-primary">
            <h1 class="text-4xl font-bold mb-2">HafalanQu</h1>
            <p class="opacity-90">Silakan login untuk melanjutkan</p>
        </div>
        
        <div class="p-8">
            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" name="username" required 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" required 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                </div>
                
                <div id="errorMsg" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100 text-center">
                    Username atau password salah.
                </div>

                <button type="submit" id="btnSubmit" 
                    class="w-full bg-primary hover:bg-primary-container text-white font-semibold py-3 px-4 rounded-lg transition-colors flex justify-center items-center gap-2">
                    <span>Masuk</span>
                </button>
                
                <div class="text-center pt-6 flex justify-center">
                    <a href="../" class="text-gray-400 hover:text-primary transition-colors p-2 rounded-full hover:bg-gray-100" title="Kembali ke Halaman Utama">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                        </svg>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbwFcB_A7WAI9A-Ca8-dihwA2VKvzH1pgf1inXbetMeYk7usNGeTZhTcfzv5pfgVswZB/exec';
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            const errorMsg = document.getElementById('errorMsg');
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full inline-block"></span> Memproses...`;
            errorMsg.classList.add('hidden');

            try {
                // We use GET for simple login check to avoid CORS preflight issues sometimes associated with POST
                // Or POST via URLSearchParams
                const formData = new URLSearchParams();
                formData.append('action', 'login');
                formData.append('username', u);
                formData.append('password', p);

                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.result === 'success') {
                    // Berhasil login
                    const inst = result.inst; // e.g. "mtsn6demak" atau "smaalislam"
                    
                    // Simpan sesi login
                    sessionStorage.setItem('instLoggedIn', inst);
                    
                    // Selalu arahkan ke form karena dashboard publik
                    window.location.href = `../${inst}/form/`;
                } else {
                    // Gagal login
                    errorMsg.innerText = result.message || 'Username atau password salah.';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerText = 'Terjadi kesalahan jaringan. Coba lagi.';
                errorMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Masuk</span>`;
            }
        });
    </script>
</body>
</html>
